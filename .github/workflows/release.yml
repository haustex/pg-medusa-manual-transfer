name: Release

# Publishes to npm when a version tag (v0.1.0, …) is pushed, after the full CI
# suite passed, through npm trusted publishing (OIDC): no NPM_TOKEN secret,
# provenance attached. On npmjs.com the package's trusted publisher must be
# GitHub Actions · haustex / pg-medusa-manual-transfer · workflow release.yml ·
# environment npm (all case-sensitive). setup-node gets no `registry-url`: it
# would write an .npmrc that expects NODE_AUTH_TOKEN and get in the way of the
# OIDC exchange. A tag for a version already on npm passes without publishing.
#
# Run it manually (workflow_dispatch) to check that configuration: it performs
# the same OIDC token exchange npm does and reports npm's answer, without
# building or publishing anything.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    if: github.event_name == 'push'
    uses: ./.github/workflows/ci.yml

  publish:
    name: ${{ github.event_name == 'push' && 'Publish to npm' || 'Check npm trusted publishing' }}
    needs: ci
    # tag push: after CI succeeded · manual run: the OIDC check only (CI is skipped)
    if: >-
      always() &&
      ((github.event_name == 'push' && needs.ci.result == 'success') ||
       (github.event_name == 'workflow_dispatch' && needs.ci.result == 'skipped'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write # OIDC token for npm trusted publishing + provenance
    steps:
      - uses: actions/checkout@v5

      # No registry-url (see above), no dependency cache in the job that holds publish rights
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      # Trusted publishing needs npm 11.5.1+; dist-tags over OIDC need 11.21.0+
      - run: npm install -g npm@^11.21.0
      - run: node --version && npm --version

      # npm performs this exchange silently and only logs failures at verbose level,
      # then fails later with ENEEDAUTH or E404. Doing it here first shows npm's
      # reason and the token claims it matches against. Nothing secret is printed.
      - name: Check npm trusted publishing (OIDC exchange)
        run: |
          set -euo pipefail
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "::error::No GitHub OIDC token available: the job needs 'permissions: id-token: write'."
            exit 1
          fi
          NAME=$(node -p "require('./package.json').name")
          ID_TOKEN=$(curl -fsS -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:registry.npmjs.org" | node -pe 'JSON.parse(require("fs").readFileSync(0)).value')
          echo "::add-mask::${ID_TOKEN}"
          echo "Claims npm compares with the trusted publisher:"
          # shellcheck disable=SC2016 # ${k} is a JavaScript template literal
          node -e '
            const c = JSON.parse(Buffer.from(process.argv[1].split(".")[1], "base64url"))
            for (const k of ["repository", "repository_owner", "workflow_ref", "job_workflow_ref", "environment", "event_name", "ref", "repository_visibility", "runner_environment"])
              console.log(`  ${k}: ${c[k] ?? "(none)"}`)' "${ID_TOKEN}"
          OUT=$(mktemp)
          STATUS=$(curl -sS -o "$OUT" -w '%{http_code}' -X POST -H "Authorization: Bearer ${ID_TOKEN}" \
            "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/${NAME}")
          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 300 ] && node -e 'process.exit(JSON.parse(require("fs").readFileSync(process.argv[1])).token ? 0 : 1)' "$OUT"; then
            echo "npm accepted this workflow as trusted publisher of ${NAME}."
            rm -f "$OUT"
          else
            MESSAGE=$(node -e 'try { const b = JSON.parse(require("fs").readFileSync(process.argv[1])); console.log(b.message ?? b.error ?? JSON.stringify(b)) } catch { console.log(require("fs").readFileSync(process.argv[1], "utf8").slice(0, 300)) }' "$OUT")
            rm -f "$OUT"
            echo "::error::npm refused the OIDC exchange for ${NAME} (HTTP ${STATUS}): ${MESSAGE}. Compare the claims above with the package's trusted publisher on npmjs.com."
            exit 1
          fi

      - name: Tag matches package.json
        if: github.event_name == 'push'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "v${VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${VERSION}"
            exit 1
          fi

      - if: github.event_name == 'push'
        run: npm ci --no-audit --no-fund
      - if: github.event_name == 'push'
        run: npm run build
      - name: Package contents
        if: github.event_name == 'push'
        run: node scripts/check-pack.mjs

      # The first version may be published by hand (a trusted publisher can only be
      # added to a package that exists); a tag for an existing version only re-verifies.
      - name: Skip if this version is already on npm
        if: github.event_name == 'push'
        id: exists
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "${NAME}@${VERSION}" version >/dev/null 2>&1; then
            echo "::notice::${NAME}@${VERSION} is already published; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        if: github.event_name == 'push' && steps.exists.outputs.skip != 'true'
        run: npm publish --provenance --access public
